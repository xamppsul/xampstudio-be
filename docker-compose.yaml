services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: app
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      dbportfolio:
        condition: service_healthy
      redis:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy
    networks:
      - laravel
    volumes:
      # Mount untuk hot-reload (development)
      - ./app:/app/app # Source code
      - ./routes:/app/routes # Routes
      - ./config:/app/config # Config
      - ./resources:/app/resources # Views, assets
      # Jangan mount vendor - sudah di image!
      # Jangan mount storage untuk database writes
    healthcheck:
      test: [ "CMD", "php", "-r", "file_exists('vendor/autoload.php') or exit(1);" ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 20s

  dbportfolio:
    image: mysql:8.0
    container_name: dbportfolio
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
      interval: 10s
    # command: --default-authentication-plugin=mysql_native_password (deprecated in this version)

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - laravel
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      timeout: 3s
      retries: 5
      interval: 10s
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:80"
    depends_on:
      dbportfolio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.php" ]
      timeout: 10s
      retries: 3
      interval: 10s
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
